<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI coding project map</title>
  <desc id="desc">A layered map connecting project boundaries, framework and scaffold, factory, ABC and Protocol, and the test, build, and CI toolchain.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10171d"/>
      <stop offset="1" stop-color="#17343b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ecbd8"/>
      <stop offset="1" stop-color="#8adbe5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g fill="#5ecbd8" opacity=".12">
    <circle cx="1450" cy="80" r="260"/>
    <circle cx="90" cy="850" r="330"/>
  </g>
  <g stroke="#5ecbd8" stroke-opacity=".13">
    <path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600"/>
    <path d="M320 0v900M640 0v900M960 0v900M1280 0v900"/>
  </g>

  <g font-family="Inter, 'Noto Sans CJK SC', sans-serif">
    <text x="110" y="120" fill="#8adbe5" font-size="26" font-weight="650" letter-spacing="5">AI CODING · PROJECT MAP</text>
    <text x="110" y="190" fill="#f3f7f8" font-size="54" font-weight="720">从“能运行”到“能交付”</text>
    <text x="110" y="238" fill="#a4b0ba" font-size="24">术语的价值，在于帮你定位项目中的真实问题</text>

    <g filter="url(#shadow)">
      <rect x="110" y="310" width="430" height="180" rx="24" fill="#252c34" stroke="#4c5865"/>
      <text x="150" y="362" fill="#5ecbd8" font-size="22" font-weight="650">01 · 项目骨架</text>
      <text x="150" y="418" fill="#f3f7f8" font-size="35" font-weight="700">Framework</text>
      <text x="150" y="458" fill="#a4b0ba" font-size="23">谁拥有流程与生命周期？</text>

      <rect x="585" y="310" width="430" height="180" rx="24" fill="#252c34" stroke="#4c5865"/>
      <text x="625" y="362" fill="#5ecbd8" font-size="22" font-weight="650">02 · 起始结构</text>
      <text x="625" y="418" fill="#f3f7f8" font-size="35" font-weight="700">Scaffold</text>
      <text x="625" y="458" fill="#a4b0ba" font-size="23">哪些文件由模板生成？</text>

      <rect x="1060" y="310" width="430" height="180" rx="24" fill="#252c34" stroke="#4c5865"/>
      <text x="1100" y="362" fill="#5ecbd8" font-size="22" font-weight="650">03 · 对象创建</text>
      <text x="1100" y="418" fill="#f3f7f8" font-size="35" font-weight="700">Factory</text>
      <text x="1100" y="458" fill="#a4b0ba" font-size="23">这次应创建哪个实现？</text>

      <rect x="110" y="545" width="665" height="180" rx="24" fill="#252c34" stroke="#4c5865"/>
      <text x="150" y="597" fill="#5ecbd8" font-size="22" font-weight="650">04 · 抽象边界</text>
      <text x="150" y="653" fill="#f3f7f8" font-size="35" font-weight="700">ABC · Protocol</text>
      <text x="150" y="693" fill="#a4b0ba" font-size="23">需要继承约束，还是结构化契约？</text>

      <rect x="820" y="545" width="670" height="180" rx="24" fill="#252c34" stroke="#4c5865"/>
      <text x="860" y="597" fill="#5ecbd8" font-size="22" font-weight="650">05 · 交付反馈</text>
      <text x="860" y="653" fill="#f3f7f8" font-size="35" font-weight="700">Test · Build · CI</text>
      <text x="860" y="693" fill="#a4b0ba" font-size="23">如何证明修改可以被交付？</text>
    </g>

    <path d="M240 790h1120" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="240" cy="790" r="10" fill="#5ecbd8"/>
    <circle cx="1360" cy="790" r="10" fill="#8adbe5"/>
    <text x="110" y="850" fill="#a4b0ba" font-size="22">需求与范围</text>
    <text x="1320" y="850" fill="#a4b0ba" font-size="22" text-anchor="end">可验证的交付</text>
  </g>
</svg>
